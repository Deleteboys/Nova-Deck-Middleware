[package]
name = "NovaDeckApp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "novadeckmiddleware_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"

serialport = "4.9.0"
postcard = "1.1.3"
heapless = { version = "0.9.2", features = ["serde"] }
enigo = "0.6.1"
dotenvy = "0.15.7"
rspotify = { version = "0.16", features = ["cli"] }
sysinfo = "0.38.4"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-log = "2.8.0"
log = "0.4.29"
tokio = "1.52.0"
open = "5.3.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_Devices", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Foundation", "Foundation_Collections", "Media_Control", ] }

[target.'cfg(target_os = "linux")'.dependencies]
# PipeWire (via pipewire-pulse) und PulseAudio sprechen beide das libpulse-Protokoll
libpulse-binding = "2.30"
# MPRIS statt GlobalSystemMediaTransportControls
zbus = "5.19"
# Aktives Fenster: X11-Sessions (u.a. KDE Plasma auf X11)
x11rb = "0.14"
# Aktives Fenster: KDE Plasma auf Wayland
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
# Ohne "wayland" kann enigo unter Hyprland/KWin-Wayland keine Tasten senden
enigo = { version = "0.6.1", features = ["wayland"] }


[profile.release.package.wry]
debug = true
debug-assertions = true
